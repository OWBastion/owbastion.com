<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OWBastion Portal 全站原型</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="review.css">
<style>
.evbar{display:grid;grid-template-columns:minmax(0,1fr) 12rem 10rem;gap:var(--space-3)}
@container (max-width:52rem){.evbar{grid-template-columns:1fr 1fr}.evbar>.search{grid-column:1/-1}}
.evflt{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-3);align-items:center;margin-top:var(--space-3)}
.fchip{display:inline-flex;align-items:center;gap:.375rem;min-height:2.25rem;padding:0 var(--space-3);border:1px solid var(--line-strong);border-radius:var(--radius-pill);font-size:.8125rem;font-weight:500;background:var(--surface)}
.fchip .n{font-size:.75rem;color:var(--quiet);font-weight:500}
.fchip[aria-pressed=true]{background:var(--accent-surface);border-color:transparent;font-weight:600}
.fchip[aria-pressed=true] .n{color:var(--text)}
.fchip:disabled{color:var(--disabled-text,var(--quiet));border-style:dashed;opacity:.6;cursor:not-allowed}
.vr{width:1px;height:1.5rem;background:var(--line-strong)}
.flt-btn{display:none}
@container (max-width:44rem){.flt-adv{display:none}.flt-btn{display:inline-flex}}
.popw{position:relative}
.pop{position:absolute;top:calc(100% + .375rem);left:0;z-index:8;width:16rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:0 .5rem 1.5rem var(--shadow);padding:var(--space-3);display:grid;gap:var(--space-2)}
.plist{display:grid;max-height:14rem;overflow:auto;margin:0 calc(var(--space-2) * -1)}
.popi{display:flex;align-items:center;gap:var(--space-2);padding:.4rem var(--space-2);border-radius:var(--radius-control);font-size:.875rem;text-align:left}
.popi:hover:not(:disabled){background:var(--surface-raised)}.popi:disabled{opacity:.45;cursor:not-allowed}.popi .n{margin-left:auto}
.cb{width:1.125rem;height:1.125rem;border:1.5px solid var(--line-strong);border-radius:.3rem;display:grid;place-items:center;flex:none}
.popi[aria-checked=true] .cb{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.cb .i{width:.8em;height:.8em;stroke-width:3}
.evquick{display:grid;gap:var(--space-2);margin-top:var(--space-3);padding:var(--space-3);border:1px solid var(--line);border-radius:var(--radius-control);background:var(--surface-raised)}
.evquick .qr{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}.evquick .lbl{min-width:3.5rem}
.fchip.grp[aria-pressed=false]{border-color:var(--accent);color:var(--text)}
.pm{display:flex;align-items:center;gap:.5rem;font-size:.75rem;color:var(--muted)}.pmt{flex:1;height:.375rem;border-radius:var(--radius-pill);background:var(--line);overflow:hidden}.pmt i{display:block;height:100%;background:var(--accent);border-radius:inherit;min-width:2px}.pm .num{color:var(--text);font-weight:600;min-width:3rem;text-align:right}
.pbig{display:grid;gap:var(--space-2)}.pbig .v{font-size:2rem;font-weight:700;line-height:1.1;color:var(--accent)}
.evsum{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;margin:var(--space-4) 0 var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--line)}
.evsum .sp{flex:1}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:var(--space-3);list-style:none;padding:0}
.evgroup{margin-top:var(--space-5)}
.evc{display:grid;grid-template-rows:auto auto minmax(3.2em,1fr) auto auto;gap:var(--space-2);width:100%;height:100%;text-align:left;padding:var(--space-4);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card)}
.evc:hover{border-color:var(--line-strong)}
.evmeta{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.ecat{display:inline-flex;align-items:center;gap:.375rem;font-size:.8125rem;font-weight:600}
.ecat i{width:.5rem;height:.5rem;border-radius:50%;background:var(--info)}.ecat.g i{background:var(--success)}.ecat.b i{background:var(--danger)}
.erar{font-size:.75rem;font-weight:700;padding:.0625rem .5rem;border-radius:var(--radius-pill);border:1px solid var(--line-strong);color:var(--muted)}
.erar.rSR{background:var(--accent-surface);border-color:transparent;color:var(--text)}
.erar.rSSR{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.evdesc{max-height:3.1em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.875rem;line-height:1.55;color:var(--muted)}
.evtags{display:flex;flex-wrap:wrap;gap:.375rem;align-items:center;min-height:1.5rem}
.tg{display:inline-flex;align-items:center;height:1.5rem;padding:0 .625rem;border-radius:var(--radius-pill);background:var(--surface-raised);font-size:.75rem;font-weight:500}
.evfoot{display:flex;gap:var(--space-3);align-items:center;padding-top:var(--space-2);border-top:1px solid var(--line);min-height:1.75rem}
.evfoot .rate{margin-left:auto;display:inline-flex;gap:.25rem;align-items:center;color:var(--warning)}
.lead{font-size:1.0625rem;line-height:1.65;color:var(--text)}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:var(--space-3)}
.effs{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--radius-control);overflow:hidden}
.effs>div{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:var(--space-3);padding:.625rem var(--space-3);border-top:1px solid var(--line);font-size:.875rem}
.effs>div:first-child{border-top:0}.effs dt{font-weight:600}.effs dd{margin:0;color:var(--muted)}
.acc{border:1px solid var(--line);border-radius:var(--radius-control);padding:var(--space-3) var(--space-4)}.acc summary{cursor:pointer;font-weight:600;font-size:.9375rem}
.sel{display:block}
.mpgrid{grid-template-columns:repeat(auto-fill,minmax(17rem,1fr))}
.mpc{padding:0;overflow:hidden;grid-template-rows:auto 1fr;gap:0}
.mpc .in{display:grid;grid-template-rows:auto auto minmax(1.5rem,auto) 1fr;gap:var(--space-2);padding:var(--space-4);align-content:start}
.mpc .cover{aspect-ratio:2/1;font-size:2rem;font-weight:700;letter-spacing:.1em;color:var(--accent);background:var(--accent-surface);border-radius:0}
.mpc .evfoot{align-self:end}
.tier{display:inline-flex;align-items:center;height:1.375rem;padding:0 .5rem;border-radius:.4rem;font-size:.75rem;font-weight:700;letter-spacing:.02em;background:var(--surface-raised);border:1px solid var(--line-strong);color:var(--text)}
.mpc .slot{font-size:.6875rem;padding:0 .4rem}
</style>
</head>
<body>
<div class="bench" id="bench"></div>
<script src="shared.js"></script>
<script src="review.js"></script>
<script>
/* ================= state & data ================= */
const S={route:'/',w:PT.get('w','desktop'),theme:PT.get('theme','light'),role:PT.get('role','player'),menu:false,sheet:false,dlg:null,toast:'',
  st:'ok',sub:'processing',qq:'idle',bind:'ready',ach:'all',evCat:'all',evQ:'',mapQ:'',mapRt:'all',tab:{},rev:'cur',myStar:0,nudge:true,rv:0,
  grant:{players:['示例玩家'],titles:[],done:false},revAct:''};
const SLOT=['开拓者','征服者','主宰'],COND=['首次通关','困难难度通关','无伤通关'];
const MAPS=[
 {id:1,name:'示例地图一',rt:'S',slots:[1,1,1],m:18,cl:0,avg:4.6,n:32},
 {id:2,name:'示例地图二',rt:'A',slots:[1,1,0],m:6,cl:0,avg:4.1,n:18},
 {id:3,name:'示例地图三',rt:'A',slots:[1,0,0],m:2,cl:1,avg:3.8,n:9},
 {id:4,name:'示例地图四',rt:'B',slots:[0,0,0],m:0,cl:0,avg:0,n:0},
 {id:5,name:'示例地图五',rt:'B',slots:[0,0,0],m:0,cl:0,avg:4.4,n:5}];

const PLAYER_TITLES=[{n:'无伤通关',c:'极限操作系列',on:1,w:1},{n:'百次通关',c:'里程碑系列',on:1,w:1},{n:'极限速通',c:'极限操作系列',on:0},{n:'千次通关',c:'里程碑系列',on:0}];
const SUBS={processing:['识别中','info','正在识别，通常几分钟内完成'],review:['待人工核对','warn','识别结果需要人工核对，已进入审核队列'],resubmit:['需重新提交','bad','截图无法确认结果，请按建议重新提交'],done:['已通过','ok','已通过，称号已记入你的公开主页']};
const B=(t,k='')=>({b:k,t});
const NOTES={};

/* ================= small ui helpers ================= */
const L=p=>'#/'+p;
const pageTitle=(t,right='')=>`<div class="row between"><h1 class="h1">${t}</h1>${right?`<div class="row">${right}</div>`:''}</div>`;
const badge=(t,k='')=>`<span class="badge ${k}">${t}</span>`;
const alertE=(t,d,act='retry')=>`<div class="alert err"><span><b>${t}</b>　${d}</span><button class="btn btn-outline btn-sm" data-act="${act}">${ic('refresh')}重试</button></div>`;
const need=(html,adminOnly)=>{
  if(S.role==='guest')return `<main class="pg narrow"><div class="card empty"><span class="h3">需要登录</span><a class="btn btn-primary btn-lg" href="${L('login')}">登录</a></div></main>`;
  if(adminOnly&&S.role!=='admin')return `<main class="pg narrow"><div class="card empty"><span class="h3">没有访问权限</span><span>此页面仅管理员可见。请在上方将「身份」切换为管理员。</span></div></main>`;
  return html;
};
const slotChips=(s)=>`<div class="slots">${s.map((v,i)=>`<span class="slot ${v?'on':''}">${ic(v?'ok':'circle')}${SLOT[i]}<span class="sr">${v?'已获得':'未获得'}</span></span>`).join('')}</div>`;
function reviewSection(o){
  const cm=[[5,'示例玩家 B','很有意思。','3 天前'],[4,'示例玩家 C','难度合适。','1 周前']];
  const star=i=>`<button data-act="star" data-n="${i}" aria-label="${i} 分" style="color:${i<=S.myStar?'var(--warning)':'var(--line-strong)'}">${ic('star').replace('<svg class="i"','<svg class="i" style="width:1.5em;height:1.5em;fill:'+(i<=S.myStar?'currentColor':'none')+'"')}</button>`;
  const editor=S.role==='guest'?`<span class="cap">登录后可评价　<a href="${L('login')}" style="color:var(--accent)">登录</a></span>`
   :S.evWrite?`<div class="card pad" style="display:grid;gap:var(--space-3)"><div class="row" style="gap:.25rem">${[1,2,3,4,5].map(star).join('')}</div><textarea class="inp" placeholder="分享你的实际体验（可选）" aria-label="评价内容"></textarea><label class="row" style="gap:.5rem;font-size:.8125rem"><input type="checkbox"> 匿名展示</label><div class="row"><button class="btn btn-primary" data-act="toast" data-m="评价已保存" ${S.myStar?'':'disabled'}>提交评价</button><button class="btn btn-ghost" data-act="evwrite">取消</button></div></div>`
   :`<button class="btn btn-outline" data-act="evwrite">${o.n?'写评价':'写第一条评价'}</button>`;
  return `<section aria-labelledby="rvh"><div class="row between"><h3 class="h3" id="rvh">玩家评价</h3>${o.n?`<span class="row" style="gap:.5rem">${stars(o.avg)}<span class="val num">${o.avg.toFixed(1)}</span><span class="cap num">${o.n} 条${o.n<10?' · 样本较少':''}</span></span>`:'<span class="cap">暂无评价</span>'}</div>
   ${o.n?`<div class="card list clip mt">${cm.map(([s,u,t,d])=>`<div style="align-items:flex-start"><div><div class="row" style="gap:.5rem"><span class="val">${u}</span>${stars(s)}</div><div class="body" style="font-size:.875rem">${t}</div></div><span class="cap">${d}</span></div>`).join('')}</div>`:''}
   <div class="mt">${editor}</div></section>`;
}

/* ================= public screens ================= */
const PUBLIC_NAV_ICONS=()=>[['events','随机事件','zap'],['maps','地图','map'],['achievements','成就','award'],['changelog','版本更新','history'],['blog','开发日志','msg']];
function home(){return `<main class="pg"><h1 class="h1" style="font-size:clamp(2.6rem,7vw,5rem);letter-spacing:-.04em">躲避堡垒 3</h1>
 <h2 class="h2 sec">目录</h2><div class="grid w mt">${PUBLIC_NAV_ICONS().map(([p,l,i])=>`<a class="card pad row" href="${L(p)}">${ic(i)}<span class="h3">${l}</span></a>`).join('')}</div></main>`}

/* ================= events ================= */
const GL={'治疗效果':'恢复生命值','受到伤害':'承受伤害的判定','生命值改变':'直接改变生命值','心之钢':'可累积层数的资源','赌徒':'赌注类事件','永久':'效果持续到本局结束','主动交互':'需要玩家主动触发','伤害减免':'降低受到的伤害','移速加成':'提升移动速度','治疗增益':'提升受到的治疗','视野收窄':'缩小可视范围','减速':'降低移动速度'};
const E=(id,name,cat,rar,ver,desc,dur,cd,w,tags,o={})=>({id,name,cat,rar,ver,desc,dur,cd,w,tags,st:'implemented',avg:0,n:0,ch:[],...o});
const EV=[
 E(1,'赌徒：乐于助人','机制','R','5.0','长按装填(R)：75% 概率使所有友方恢复 85% 最大生命值；25% 概率使所有玩家生命值降低至 1',15,null,1,['治疗效果','受到伤害','生命值改变']),
 E(2,'赌徒：梭哈艺术','机制','SR','5.0','长按装填(R)以 25% 心之钢层数为赌注：8% 概率获得赌注等值 ×5 的心之钢层数',15,null,.9,['心之钢'],{avg:4.3,n:12}),
 E(3,'赌徒：心之钢','机制','SSR','5.0','长按装填(R)：40% 概率使心之钢层数 ×1.5；60% 概率失去 50% 层数',15,null,.7,['心之钢','赌徒'],{avg:3.6,n:8}),
 E(4,'赌徒：赢家通吃','机制','SR','5.0','长按装填(R)以 25% 心之钢层数为赌注：10% 概率清空奖池，拿走所有心之钢层数',15,null,1,['心之钢']),
 E(5,'赌徒：掷骰狂人','机制','SSR','5.0','长按装填(R)掷出一颗永久改变属性的骰子：1 点损失 5 层心之钢；2 点损失 2% 移速加成；3 点损失 2% 伤害减免与治疗增益；4 点获得 2% 移速加成……',20,null,1.2,['永久','心之钢','伤害减免','移速加成','治疗增益'],{avg:4.6,n:21,ch:[{f:'achievement',t:'示例成就挑战'}]}),
 E(6,'赌徒：短期投资','机制','R','4.0','长按装填(R)：以接下来 3 个事件均为减益为代价，75% 的概率永久获得 4 层心之钢层数',15,null,1,['心之钢','永久','主动交互']),
 E(7,'赌徒：长期投资','机制','SSR','4.0','长按装填(R)：以接下来 5 个事件均为减益为代价，33% 的概率永久获得 24 层心之钢层数',15,null,1.1,['心之钢','永久'],{avg:4.0,n:6}),
 E(15,'作弊：循环往复','机制','SR','2026周年','长按R消耗6层心之钢（约4.5%最大生命值），下个事件将重演最近一次可重现的增益',15,null,.6,['心之钢','主动交互']),
 E(16,'作弊：先知','机制','SR','2026周年','可看到其他玩家的下一个事件',90,null,.6,['主动交互']),
 E(17,'任务：有福同享','增益','SSR','2026周年','选择1名友方，双方通过终点后各获得16层心之钢',120,0,.4,['心之钢','主动交互']),
 E(18,'任务：同行链','机制','R','2026周年','与一名友方相连，被持续牵引向对方',45,null,1,['主动交互']),
 E(19,'任务：在哪里跌倒','增益','SSR','2026周年','受到致命伤害时被击倒，友方靠近可使用互动将你扶起并恢复40%生命值',60,2,.4,['治疗效果','主动交互']),
 E(8,'示例增益事件 A','增益','R','5.0','（示例）持续期间获得移速加成',30,90,1,['移速加成'],{avg:4.8,n:22}),
 E(9,'示例增益事件 B','增益','SR','4.0','（示例）持续期间受到的治疗提升',20,120,.8,['治疗增益','治疗效果']),
 E(10,'示例增益事件 C','增益','SSR','3.0','（示例）获得一次伤害减免',15,180,.6,['伤害减免'],{avg:4.1,n:9}),
 E(11,'示例减益事件 A','减益','R','5.0','（示例）持续期间移动速度降低',30,90,1.2,['减速'],{avg:3.5,n:14,ch:[{f:'map',t:'示例地图一 事件生存'}]}),
 E(12,'示例减益事件 B','减益','SR','3.0','（示例）持续期间视野收窄',20,120,.9,['视野收窄','受到伤害']),
 E(13,'示例减益事件 C','减益','SSR','4.0','（示例）已从游戏中移除的事件',15,null,null,['受到伤害'],{st:'removed'}),
 E(14,'示例机制事件 X','机制','SR','5.1','（示例）开发中的事件',15,null,null,['主动交互'],{st:'development'})
];
const CATS=['增益','减益','机制'],RARS=['R','SR','SSR'],CAT_P={增益:.425,减益:.375,机制:.2};
S.ev={cat:[],rar:[],tags:[],ver:[],grp:[],incl:false,pop:''};S.evQ='';S.evTq='';S.evSort='ver';S.evGroup='none';S.evWrite=false;
const grpOf=e=>{const i=e.name.indexOf('：');return i>0?e.name.slice(0,i):null};
const ALLGRP=Object.entries(EV.reduce((m,e)=>{const g=grpOf(e);if(g)m[g]=(m[g]||0)+1;return m},{})).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
const grpKey=e=>ALLGRP.includes(grpOf(e))?grpOf(e):'其他';
const TOPTAGS=Object.entries(EV.flatMap(e=>e.tags).reduce((m,t)=>(m[t]=(m[t]||0)+1,m),{})).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0]);
const ALLTAGS=[...new Set(EV.flatMap(e=>e.tags))],ALLVER=[...new Set(EV.map(e=>e.ver))].sort((a,b)=>b.localeCompare(a,undefined,{numeric:true}));
function prob(e){
  const g=EV.filter(x=>x.st==='implemented'&&x.cat===e.cat),ws=g.map(x=>x.w);
  if(e.w==null||ws.some(w=>w==null)||e.st!=='implemented')return null;
  const tot=ws.reduce((a,b)=>a+b,0),n=g.length,succ=Math.min(1,tot/(n*2.5)),fail=1-succ,guar=fail**8;
  const app=(e.w/(n*2.5))*(1-guar)/((1-fail)||1)+guar/n;
  return {cat:CAT_P[e.cat],fail,guar,app,glob:CAT_P[e.cat]*app};
}
const PMAX=()=>Math.max(...EV.map(e=>prob(e)?.glob||0));
const pct=v=>v==null?'—':new Intl.NumberFormat('zh-CN',{maximumFractionDigits:1}).format(v*100)+'%';
function evMatch(e,skip){
  const f=S.ev,q=S.evQ.trim();
  return (skip==='st'||f.incl||e.st==='implemented')&&(skip==='cat'||!f.cat.length||f.cat.includes(e.cat))&&(skip==='rar'||!f.rar.length||f.rar.includes(e.rar))
   &&(skip==='grp'||!f.grp.length||f.grp.includes(grpKey(e)))&&(skip==='tags'||!f.tags.length||f.tags.every(t=>e.tags.includes(t)))&&(skip==='ver'||!f.ver.length||f.ver.includes(e.ver))&&(!q||(e.name+e.desc+e.tags.join('')).includes(q));
}
const facet=(d,v)=>['rate','mech','mver'].includes(d)?mfacet(d,v):EV.filter(e=>evMatch(e,d)&&(d==='cat'?e.cat===v:d==='rar'?e.rar===v:d==='ver'?e.ver===v:d==='grp'?grpKey(e)===v:e.tags.includes(v))).length;
const evList=()=>{
  const l=EV.filter(e=>evMatch(e));
  const cmp={ver:(a,b)=>b.ver.localeCompare(a.ver,undefined,{numeric:true})||a.name.localeCompare(b.name),name:(a,b)=>a.name.localeCompare(b.name),prob:(a,b)=>(prob(b)?.glob??-1)-(prob(a)?.glob??-1),rate:(a,b)=>(b.avg||-1)-(a.avg||-1)}[S.evSort];
  return l.sort(cmp);

 '/events':{t:'随机事件',b:[['1 搜索与筛选','搜索同时匹配名称、描述和效果；类别、稀有度常驻为可组合的切换按钮，效果与版本收进下拉；每个选项旁显示在当前条件下的数量，0 项的选项置灰，不会走进死胡同。已选条件以可移除的标签列在结果数上方，一键清除。窄屏合并为一个「筛选」入口，打开底部面板。'],['2 卡片','所有卡片同一版式：名称 → 类别（圆点+文字）· 稀有度（胶囊，R/SR/SSR 逐级加重）· 版本 → 描述 2 行 → 效果标签 → 关键数据（持续、概率、评分）。整张卡片是一个按钮，标签不再是嵌套按钮，因此高度一致；没有评分不显示「暂无评分」；「已实装」不再重复显示，只在开发中/已移除时标注。'],['3 分类','默认不分组，按最新版本排序，版本只是卡片上的一个小标注；需要时可切换按版本或按类别分组，也可按名称、出现概率、评分排序。'],['4 详情','先是一句话描述，再是最多三块关键数据（未知的不显示），然后是效果（每条一行说明，手机上不依赖悬停），挑战仅在有时显示，技术性的概率细节折叠，评价是紧凑的一行汇总加「写评价」按钮，展开才出现表单。地址为 #/events/编号，可分享。']],l:['效果筛选为「同时包含」；类别/稀有度/版本为「任一」','效果释义为示例文案']},
 '/maps':{t:'地图（与随机事件同一套布局）',b:[['复用了什么','搜索 + 排序、可组合的筛选按钮（附数量、0 项置灰）、已选条件标签、结果数、卡片网格、点开的详情面板、可分享的地址 #/maps/编号，全部与随机事件一致。'],['地图特有的','卡片带封面；评级用 5 点，同时写数字；登录后卡片底部显示三个地图称号的获得情况，并多一个「我的称号进度」筛选（进行中 / 未开始 / 已集齐）和「我的进度」排序。访客不显示任何个人信息，只在详情里出现一处登录提示，不再每张卡片重复「登录后查看」。'],['详情','先是关键数据（挑战数、我的称号、通关次数），再是特殊机制、地图称号（含当前/经典版本切换，经典版本不计入当前进度）、挑战、我的精通与最近通关，最后是评价。']],l:['特殊机制筛选为「同时包含」；评级、版本为「任一」','机制、挑战名称为示例']},
 '/achievements':{t:'成就',b:[['调整','成就只做目录与佩戴；标题固定为「成就」，个人地图进度不再在此重复，链接到公开主页。']],l:['访客：只读目录，无佩戴与过滤']},
 '/changelog':{t:'版本更新',b:[['说明','沿用现有版式，只收录已发布内容。']]},'/blog':{t:'开发日志',b:[['说明','沿用现有版式；文章页限制行宽 42rem。']]},
 '/login':{t:'登录',b:[['调整','Passkey 为首选主按钮，QQ 群验证为次选；QQ 验证在同一位置展开为验证码面板，有倒计时、复制、取消，过期后原位重试。']],l:['验证码只保存在当前标签页']},
 '/bind':{t:'绑定 QQ',b:[['调整','一个卡片承载全部状态；顶部工具栏可演示：等待验证 / 待处理 / 已过期 / 未通过 / 完成。']]},'/recover':{t:'恢复帐号',b:[['说明','仅一个输入 + 一个主按钮；无效链接给出返回登录。']]},
 '/me':{t:'玩家中心',b:[['问题','原来它同时承担「个人进度展示」和「工作台」，与成就页重复。'],['调整','玩家中心只做「接下来要做什么」：提交、待处理提示、最近提交、进度快照。展示类内容（称号、热力图、分享）交给公开主页（#267）。']],l:['顶部动作固定：公开主页、提交截图','需要处理的提交用一条提示突出，不再散落']},
 '/me/settings':{t:'个人设置',b:[['调整','帐号、登录方式（多 Passkey 列表）、公开主页入口三块；退出登录在账号菜单。']]},
 '/submit':{t:'提交截图',b:[['调整','头部常驻入口；上传后直接进入详情。']]},
 '/submissions':{t:'提交详情',b:[['调整','状态与下一步在最上；四种状态可用「提交状态」切换：识别中 / 待人工核对 / 需重新提交 / 已通过。通过后主动作是查看公开主页。']],l:['证据保持原始比例；OCR 反馈仅在有识别结果后出现']},
 '/admin':{t:'管理后台',b:[['问题','原侧栏 11 个入口，「玩家/邀请/更多」多层嵌套，绑定例外与邀请在同一页却分在两个菜单。'],['调整','按工作流分五组：总览、内容、玩家、审核、工具。绑定与邀请合并为一页两个 Tab；评价审核归到玩家。'],['统一范式','列表：文档级滚动、服务端分页；窄屏变记录列表（状态 + 主标识优先）；点击行打开详情/决定对话框，手机端为底部抽屉。']],l:['所有审批/驳回/撤销不强制填写原因，备注可选','仅管理员可见；其他身份显示无权限']}

function notes(){
  const key=Object.keys(NOTES).sort((a,b)=>b.length-a.length).find(k=>k==='/'?S.route==='/':S.route===k||S.route.startsWith(k+'/'));
  return noteHTML(NOTES[key]||{t:'—'})+siteMap('portal.html')+`<h3>全局信息架构</h3><ul><li><b>公开：</b>随机事件 · 地图 · 成就 · 版本更新 · 开发日志</li><li><b>玩家：</b>提交截图（常驻）· 玩家中心 · 公开主页 · 个人设置</li><li><b>管理：</b>总览 · 内容 · 玩家 · 审核 · 工具</li></ul>`;
}

/* ================= router ================= */
function screen(){
  const r=S.route,seg=r.split('/').filter(Boolean),a=seg[0]||'';
  switch(a){
   case '':return home();case 'events':return events();case 'maps':return maps();
   case 'achievements':return achievements();case 'changelog':return changelog();case 'blog':return seg[1]?post(seg[1]):blog();
   case 'login':return seg[1]?loginDone():login();case 'bind':return bind();case 'recover':return recover();
   case 'me':return seg[1]==='settings'?settings():me();case 'submit':return submit();case 'submissions':return submission();
   case 'admin':return admin();
  }
  return `<main class="pg"><div class="card empty"><span class="h3">页面不存在</span><a class="btn btn-outline" href="#/">返回首页</a></div></main>`;
}
const sync=bench({S,render:()=>render(),onAct,extra:[
  {k:'st',label:'数据状态',opts:[['ok','正常'],['empty','空'],['loading','读取中'],['partial','部分失败'],['error','失败']]},
  {k:'sub',label:'提交状态',opts:[['processing','识别中'],['review','待核对'],['resubmit','需重提'],['done','已通过']]}]});
function render(){
  sync();
  const admin=S.route.startsWith('/admin'),fr=$('#frame');
  const sg=S.route.split('/').filter(Boolean);
  const dl=sg[0]==='events'&&sg[1]?evDlg(sg[1]):sg[0]==='maps'&&sg[1]?mapDlg(sg[1]):dialog(S.dlg&&S.dlg.dyn?(S.dlg.dyn==='mflt'?mfltDlg():fltDlg()):S.dlg);
  fr.innerHTML=header(S,{route:S.route,adminPage:admin&&S.role==='admin'})+screen()+dl+toast(S);
  $('#notes').innerHTML=notes();
  rvAfterRender();
  const first=S.route.split('/').filter(Boolean)[0]||'';
  document.querySelector('[data-row=st]').hidden=!['events','maps','me','admin'].includes(first);
  document.querySelector('[data-row=sub]').hidden=first!=='submissions';
  document.querySelectorAll('.seg[data-k]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(S[g.dataset.k]===b.dataset.v))));
}
function onAct(act,el,e){
  const rv=rvAct(act,el,e);if(rv)return rv.render?undefined:false;
  const d=el.dataset;
  switch(act){
   case 'toast':S.toast=d.m;clearTimeout(flash.t);flash.t=setTimeout(()=>{S.toast='';render()},1800);return;
   case 'done':S.dlg=null;S.toast='已执行：'+d.m+'（原型）';clearTimeout(flash.t);flash.t=setTimeout(()=>{S.toast='';render()},1800);return;
   case 'ftog':{const a=S.ev[d.d];S.ev[d.d]=a.includes(d.v)?a.filter(x=>x!==d.v):[...a,d.v];return}
   case 'frm':S.ev[d.d]=S.ev[d.d].filter(x=>x!==d.v);return;
   case 'fclear':S.ev={cat:[],rar:[],tags:[],ver:[],grp:[],incl:false,pop:'',rate:[],mech:[],mver:[]};S.evQ='';S.evTq='';S.mpQ='';S.mpTq='';S.mpProg='all';return;
   case 'mprog':S.mpProg=d.v;return;
   case 'mfopen':S.dlg={title:'筛选',dyn:'mflt'};return;
   case 'mopen':location.hash='#/maps/'+d.id;return false;
   case 'mclose':location.hash='#/maps';return false;
   case 'mscrim':if(e.target!==el)return false;location.hash='#/maps';return false;
   case 'incl':S.ev.incl=!S.ev.incl;return;
   case 'pop':S.ev.pop=S.ev.pop===d.v?'':d.v;return;
   case 'fopen':S.dlg={title:'筛选',dyn:'flt'};return;
   case 'evopen':location.hash='#/events/'+d.id;return false;
   case 'evclose':location.hash='#/events';return false;
   case 'evscrim':if(e.target!==el)return false;location.hash='#/events';return false;
   case 'evwrite':S.evWrite=!S.evWrite;return;
   case 'retry':S.st='ok';return;
   case 'nopk':S.nudge=false;return;
   case 'delpk':S.dlg={title:'删除 Passkey',body:`<p class="body">删除「${d.n}」后，该设备将无法用它登录。</p>`,foot:`<button class="btn btn-ghost" data-act="close">取消</button><button class="btn btn-danger" data-act="done" data-m="删除 ${d.n}">删除</button>`};return;
   case 'pk':S.role='player';PT.set('role','player');location.hash='#/login/done';return false;
   case 'qq':S.qq=d.v;return;
   case 'qqok':S.role='player';PT.set('role','player');location.hash='#/login/done';return false;
   case 'bind':S.bind=d.v;return;
   case 'copy':S.toast='已复制';clearTimeout(flash.t);flash.t=setTimeout(()=>{S.toast='';render()},1500);return;
   case 'star':S.myStar=+d.n;return;
   case 'atab':S.tab[d.key]=+d.i;return;
   case 'row':S.dlg=adRowDialog(d.key,+d.tab,+d.i);return;
   case 'gsel':{const a=S.grant[d.k],v=d.v;S.grant[d.k]=a.includes(v)?a.filter(x=>x!==v):[...a,v];return}
   case 'gdo':S.grant.done=true;return;case 'greset':S.grant={players:[],titles:[],done:false};return;
   case 'newrev':S.dlg={title:'新建版本修订',body:`<div class="field"><label>来源版本修订</label><select class="inp"><option>v2.3</option></select></div><div class="field"><label>目标游戏版本</label><input class="inp" placeholder="例如 2.5"></div><label class="row" style="gap:.5rem"><input type="checkbox"> 复制空间配置和挑战分配</label><p class="cap">从准备中开始。复制配置不会复制玩家进度。</p>`,foot:`<button class="btn btn-ghost" data-act="close">取消</button><button class="btn btn-primary" data-act="done" data-m="创建修订">创建修订</button>`};return;
   case 'revoke':S.dlg={title:'撤销称号',body:`<p class="body">撤销「${d.n}」？此操作会写入审计记录。</p>`,foot:`<button class="btn btn-ghost" data-act="close">取消</button><button class="btn btn-danger" data-act="done" data-m="撤销 ${d.n}">确认撤销</button>`};return;
   case 'ban':S.dlg={title:'封禁玩家',body:`<div class="field"><label for="br">封禁原因（可选）</label><input class="inp" id="br"></div>`,foot:`<button class="btn btn-ghost" data-act="close">取消</button><button class="btn btn-danger" data-act="done" data-m="封禁">确认封禁</button>`};return;
   case 'recover':S.dlg={title:'签发 Passkey 恢复链接',body:`<label class="row" style="gap:.5rem;align-items:flex-start"><input type="checkbox" id="vf"> <span>我已通过独立方式核验玩家身份，并确认恢复到此帐号。</span></label>`,foot:`<button class="btn btn-ghost" data-act="close">取消</button><button class="btn btn-primary" data-act="rec2">核验并签发恢复链接</button>`};return;
   case 'rec2':S.dlg={title:'一次性恢复链接已签发',body:`<div class="code">https://example.invalid/recover?token=••••••••</div>`,foot:`<button class="btn btn-outline" data-act="copy">${ic('copy')}复制恢复链接</button><button class="btn btn-primary" data-act="close">完成</button>`};return;
  }
}
/* text inputs keep focus across re-render */
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.bind;if(!k)return;S[k]=e.target.value;const p=e.target.selectionStart;render();const n=document.querySelector(`[data-bind=${k}]`);n.focus();try{n.setSelectionRange(p,p)}catch{}});
document.addEventListener('click',e=>{if(S.ev.pop&&!e.target.closest('.popw')){S.ev.pop='';render()}});
function nav(){S.route=location.hash.slice(1)||'/';RV.pend='';RV.edit='';RV.add='';RV.full=false;VW.fit=true;S.evWrite=false;S.ev.pop='';S.menu=false;S.sheet=false;S.dlg=null;S.st='ok';if(S.route.startsWith('/admin')&&S.role==='guest')S.role='guest';render();window.scrollTo(0,0)}
addEventListener('hashchange',nav);nav();
</script>
</body>
