<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>事件管理 · 主从布局原型</title>
<style>
:root{--bg:#14100d;--panel:#1c1611;--panel2:#241c15;--line:#3a2e24;--text:#f3e6d3;--muted:#a8967f;--accent:#e8884a;--accent-soft:#e8884a26;--ok:#7fcf8a;--warn:#e8b84a;--bad:#e06c5b;--info:#6fa8dc;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.page{max-width:1280px;margin:0 auto;padding:20px 20px 40px}
h1{margin:0 0 14px;font-size:26px;display:flex;align-items:baseline;gap:10px}
h1 small{font-size:13px;color:var(--muted);font-weight:400}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.search{flex:1 1 220px;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a0f06;font-weight:600}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.chip i{font-style:normal;opacity:.6;margin-left:4px}
.sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.split{display:grid;grid-template-columns:minmax(360px,480px) 1fr;gap:14px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.list{max-height:calc(100vh - 260px);min-height:360px;overflow:auto}
.sec{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-weight:600}
.sec .caret{background:none;border:0;padding:0;width:20px;color:var(--muted)}
.sec .cnt{color:var(--muted);font-weight:400;font-size:12px}
.sec .sp{flex:1}
.sec.off{color:var(--muted)}
.sec .pill{font-size:11px;background:#e8b84a22;color:var(--warn);border-radius:999px;padding:1px 8px;font-weight:500}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #2a2118;cursor:pointer;border-left:3px solid transparent}
.row:hover{background:#ffffff08}
.row.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.row.dim{opacity:.5}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:12px;border-radius:6px;padding:0 7px;border:1px solid;white-space:nowrap}
.t-增益{color:var(--ok);border-color:#7fcf8a55;background:#7fcf8a14}
.t-减益{color:var(--bad);border-color:#e06c5b55;background:#e06c5b14}
.t-机制{color:var(--info);border-color:#6fa8dc55;background:#6fa8dc14}
.num{font-variant-numeric:tabular-nums;text-align:right;font-size:13px;flex:none}.num.w{width:30px;color:var(--muted)}.num.p{width:50px;font-weight:600}
.lhead{display:flex;gap:10px;padding:6px 12px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--panel)}.lhead .nm{flex:1}.lhead span:not(.nm){text-align:right}
.grp{font-style:normal;font-size:11px;color:var(--accent);border:1px solid #e8884a55;border-radius:5px;padding:0 5px;margin-right:6px;font-weight:500}
.rar{font-weight:700;font-size:12px;width:30px;text-align:right;color:var(--muted)}
.rar.SSR{color:var(--accent)}
.rar.SR{color:#c58fe0}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.implemented{background:var(--ok)}.dot.development{background:var(--warn)}.dot.removed{background:#6b5d4d}
.chk{width:18px;height:18px;accent-color:var(--accent);flex:none}
.detail{padding:18px 20px;position:sticky;top:12px}
.detail h2{margin:0;font-size:22px}
.dh{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
.saved{font-size:12px;color:var(--muted);white-space:nowrap}
.saved.dirty{color:var(--warn)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.grid .full{grid-column:1/-1}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);min-width:0}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.prob{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.prob .big{font-size:26px;font-weight:700;color:var(--accent);line-height:1.1}
.prob .bar2{height:6px;background:#2a2118;border-radius:3px;margin:8px 0 4px;overflow:hidden}
.prob .bar2 i{display:block;height:100%;background:var(--accent)}
.prob small{color:var(--muted)}
.foot{display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);align-items:center}
.foot .sp{flex:1}
.danger{color:var(--bad)}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.batch{display:none;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel2);border-radius:0 0 14px 14px}
.batch.show{display:flex}
.back{display:none}
.switch{appearance:none;width:34px;height:20px;border-radius:999px;background:#4a3d30;position:relative;cursor:pointer;flex:none;border:0}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch:checked{background:var(--accent)}.switch:checked::after{transform:translateX(14px)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:none;gap:12px;align-items:center;box-shadow:0 10px 30px #000a;z-index:9}
.toast.show{display:flex}
.toast button{background:none;border:0;color:var(--accent);font-weight:600}
@media (max-width:820px){
  .split{grid-template-columns:1fr}
  .list{max-height:none}
  .detail{position:fixed;inset:0;z-index:5;border-radius:0;overflow:auto;display:none}
  .split.open .detail{display:block}
  .back{display:inline-block;margin-bottom:10px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="page">
  <h1>事件管理 <small id="count"></small></h1>
  <div class="bar">
    <input class="search" id="q" placeholder="搜索名称、效果或类别" aria-label="搜索事件">
    <button class="btn" id="batchBtn">批量选择</button>
    <button class="btn">导入 CSV</button>
    <button class="btn primary" id="newBtn">＋ 新建事件</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="split" id="split">
    <div class="card">
      <div class="lhead" aria-hidden="true"><span style="width:18px"></span><span class="nm">事件</span><span style="width:44px">类别</span><span style="width:30px">稀有</span><span style="width:30px">权重</span><span style="width:50px">概率</span></div>
      <div class="list" id="list"></div>
      <div class="batch" id="batch"></div>
    </div>
    <div class="card detail" id="detail"></div>
  </div>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="undo">撤销</button></div>

<script>
const VERSIONS=["5.0","4.0","3.0","2026周年","2.0","1.0"];
const CATS=["增益","减益","机制"];
const RARS=["R","SR","SSR"];
const STATUS={implemented:"已实装",development:"开发中",removed:"已移除"};
const GROUPS=["赌徒","作弊","任务"];
const names=["有福同享","循环往复","先知","同行链","在哪里跌倒","孤注一掷","沉默是金","重力反转","双倍奉还","镜像世界","时间回溯","幸运星","烈焰之路","寒冰屏障","影分身","能量风暴","失重","磁力牵引","瞬移","护盾","狂暴","隐身","急冻","连锁闪电","治愈之泉","负重前行","盲区","回声","反噬","共鸣","加速带","陷阱","补给","传送门","镜花水月","背水一战","破釜沉舟","天罚","福星高照","暗度陈仓"];
const descs=["选择1名友方，双方通过终点后各获得16层心之钢","长按R消耗6层心之钢，下个事件将重演最近一次可重现的增益","可看到其他玩家的下一个事件","与一名友方相连，被持续牵引向对方","受到致命伤害时被击倒，友方靠近可使用互动将你扶起并恢复40%生命值","本局内所有伤害提高，但无法被治疗","短时间内无法使用技能，换取额外移动速度","重力方向翻转，持续一段时间","受到的伤害按比例反弹给最近的敌人"];
let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
const EV=[];
for(let i=0;i<46;i++){const w=[1,0.6,0.4,0.2][Math.floor(rnd()*4)];EV.push({id:"e"+i,name:names[i%names.length]+(i>=names.length?" II":""),cat:CATS[Math.floor(rnd()*3)],desc:descs[i%descs.length],dur:[15,30,45,60,90,120][Math.floor(rnd()*6)],cd:rnd()>.6?Math.floor(rnd()*4):null,w,ver:VERSIONS[Math.floor(rnd()*6)],status:rnd()>.85?"removed":rnd()>.8?"development":"implemented",tags:rnd()>.5?["位移"]:[],grp:rnd()>.45?GROUPS[Math.floor(rnd()*3)]:""})}
const rarityOf=w=>w>=1?"R":w>=0.6?"SR":"SSR";
const suspended=new Set();
const state={q:"",f:{grp:new Set(),ver:new Set(),cat:new Set(),rar:new Set(),st:new Set()},sel:null,collapsed:new Set(),batch:false,picked:new Set(),open:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function visible(){const q=state.q.trim().toLowerCase();return EV.filter(e=>{
  if(q&&!(e.name+e.desc+e.cat).toLowerCase().includes(q))return false;
  const f=state.f;
  if(f.grp.size&&!f.grp.has(e.grp||"无"))return false;
  if(f.ver.size&&!f.ver.has(e.ver))return false;
  if(f.cat.size&&!f.cat.has(e.cat))return false;
  if(f.rar.size&&!f.rar.has(rarityOf(e.w)))return false;
  if(f.st.size&&!f.st.has(e.status))return false;
  if(!f.st.size&&e.status==="removed"&&!state.q)return false; // 默认隐藏已移除
  return true})}
const CAT_P={增益:.425,减益:.375,机制:.2};
const pct=v=>v==null?"—":new Intl.NumberFormat("zh-CN",{maximumFractionDigits:v<.01?2:1}).format(v*100)+"%";
function prob(e){ // 与玩家端原型相同：类别概率 × 类别内出现概率（含保底）
  const g=EV.filter(x=>x.status==="implemented"&&x.cat===e.cat);
  if(e.status!=="implemented"||!g.length)return {glob:null,cat:CAT_P[e.cat],n:g.length};
  const n=g.length,tot=g.reduce((a,x)=>a+x.w,0),succ=Math.min(1,tot/(n*2.5)),fail=1-succ,guar=fail**8;
  const app=(e.w/(n*2.5))*(1-guar)/((1-fail)||1)+guar/n;
  return {glob:CAT_P[e.cat]*app,cat:CAT_P[e.cat],n,tot};
}

function chipGroup(key,label,items,count){return items.map(v=>`<button class="chip ${state.f[key].has(v)?"on":""}" data-k="${key}" data-v="${esc(v)}">${esc(key==="st"?STATUS[v]:v)}<i>${count(v)}</i></button>`).join("")}
function renderChips(){
  const c=(fn)=>v=>EV.filter(e=>fn(e)===v).length;
  const grps=[...new Set(EV.map(e=>e.grp).filter(Boolean))].sort(),gc=g=>EV.filter(e=>(e.grp||"无")===g).length;
  $("#chips").innerHTML=chipGroup("grp","事件组",[...grps,"无"],gc)+'<span class="sep"></span>'+chipGroup("ver","版本",VERSIONS,c(e=>e.ver))+'<span class="sep"></span>'+chipGroup("cat","类别",CATS,c(e=>e.cat))+'<span class="sep"></span>'+chipGroup("rar","稀有度",RARS,c(e=>rarityOf(e.w)))+'<span class="sep"></span>'+chipGroup("st","状态",Object.keys(STATUS),c(e=>e.status))+
  (Object.values(state.f).some(s=>s.size)?'<button class="chip" id="clear">清除筛选</button>':"")}

function renderList(){
  const list=visible();$("#count").textContent=`${list.length} / ${EV.length} 条`;
  let h="";
  for(const v of VERSIONS){
    const items=list.filter(e=>e.ver===v);
    if(!items.length&&state.f.ver.size&&!state.f.ver.has(v))continue;
    if(!items.length&&(state.q||Object.values(state.f).some(s=>s.size)))continue;
    const off=suspended.has(v),col=state.collapsed.has(v);
    h+=`<div class="sec ${off?"off":""}"><button class="caret" data-col="${v}" aria-label="${col?"展开":"收起"}">${col?"▸":"▾"}</button><span>${v}</span><span class="cnt">${items.length} 条</span>${off?'<span class="pill">已挂起</span>':""}<span class="sp"></span><input type="checkbox" class="switch" data-sus="${v}" ${off?"":"checked"} aria-label="${off?"恢复":"挂起"}版本 ${v}" title="${off?"已挂起：下次构建不含此版本":"可用"}"></div>`;
    if(!col)h+=items.map(e=>`<div class="row ${state.sel===e.id?"sel":""} ${off||e.status==="removed"?"dim":""}" data-id="${e.id}">${state.batch?`<input type="checkbox" class="chk" data-pick="${e.id}" ${state.picked.has(e.id)?"checked":""}>`:""}<span class="dot ${e.status}" title="${STATUS[e.status]}"></span><div class="nm"><b>${e.grp?`<em class="grp">${esc(e.grp)}</em>`:""}${esc(e.name)}</b><span>${esc(e.desc)}</span></div><span class="tag t-${e.cat}">${e.cat}</span><span class="rar ${rarityOf(e.w)}">${rarityOf(e.w)}</span><span class="num w">${e.w}</span><span class="num p">${pct(prob(e).glob)}</span></div>`).join("");
  }
  $("#list").innerHTML=h||'<div class="empty">没有符合条件的事件<br><button class="btn" id="clear2" style="margin-top:10px">清除筛选</button></div>';
  const b=$("#batch");b.classList.toggle("show",state.batch);
  b.innerHTML=`<b>已选 ${state.picked.size}</b><button class="btn" data-b="implemented">设为已实装</button><button class="btn" data-b="removed">设为已移除</button><select class="btn" id="bver"><option value="">移到版本…</option>${VERSIONS.map(v=>`<option>${v}</option>`).join("")}</select>`;
}

function renderDetail(){
  const e=EV.find(x=>x.id===state.sel);const d=$("#detail");
  if(!e){d.innerHTML='<div class="empty">在左侧选择一个事件查看和编辑<br><span style="font-size:12px">改动会自动保存，可随时撤销</span></div>';return}
  const pr=prob(e),top=EV.filter(x=>x.cat===e.cat&&x.status==="implemented").sort((a,b)=>b.w-a.w).slice(0,3);
  d.innerHTML=`<button class="btn back" id="back">← 返回列表</button>
  <div class="dh"><h2>${esc(e.name)}</h2><span class="saved" id="saved">已保存</span></div>
  <div class="meta">${e.grp?`<span class="tag" style="color:var(--accent);border-color:#e8884a55">${esc(e.grp)}</span>`:""}<span class="tag t-${e.cat}">${e.cat}</span><span class="tag" style="color:var(--muted);border-color:var(--line)">${rarityOf(e.w)}</span><span class="tag" style="color:var(--muted);border-color:var(--line)">${e.ver}</span>${suspended.has(e.ver)?'<span class="tag" style="color:var(--warn);border-color:#e8b84a55">版本已挂起</span>':""}</div>
  <div class="grid">
    <label class="f full">名称<input data-f="name" value="${esc(e.name)}"></label>
    <label class="f full">事件效果<textarea data-f="desc">${esc(e.desc)}</textarea></label>
    <label class="f">事件组<input data-f="grp" list="grps" value="${esc(e.grp||"")}" placeholder="无（可输入新组名）"><datalist id="grps">${[...new Set(EV.map(x=>x.grp).filter(Boolean))].map(g=>`<option value="${esc(g)}">`).join("")}</datalist></label>
    <label class="f">类别<select data-f="cat">${CATS.map(c=>`<option ${c===e.cat?"selected":""}>${c}</option>`).join("")}</select></label>
    <label class="f">状态<select data-f="status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===e.status?"selected":""}>${v}</option>`).join("")}</select></label>
    <label class="f">所属版本<select data-f="ver">${VERSIONS.map(v=>`<option ${v===e.ver?"selected":""}>${v}</option>`).join("")}</select></label>
    <label class="f">持续时间（秒）<input type="number" data-f="dur" value="${e.dur}"></label>
    <label class="f">内置冷却（秒）<input type="number" data-f="cd" value="${e.cd??""}" placeholder="无"></label>
    <label class="f">权重<input type="number" step="0.1" min="0" data-f="w" value="${e.w}"></label>
    <div class="full prob" aria-live="polite"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="big">${pct(pr.glob)}</span><small>全局出现概率 · 稀有度由权重推导：${rarityOf(e.w)}</small></div><div class="bar2"><i style="width:${Math.min(100,(pr.glob||0)*800)}%"></i></div><small>${e.cat}类别概率 ${pct(pr.cat)}，类别内 ${pr.n} 个已实装事件。同类别权重最高：${top.map(t=>`${esc(t.name)} ${t.w}`).join("、")||"—"}</small></div>
  </div>
  <div class="foot"><button class="btn" id="prev">‹ 上一条</button><button class="btn" id="next">下一条 ›</button><span class="sp"></span><button class="btn danger" id="arch">归档</button></div>`;
}

let timer;
function markSaved(){const s=$("#saved");if(!s)return;s.textContent="保存中…";s.className="saved dirty";clearTimeout(timer);timer=setTimeout(()=>{const s2=$("#saved");if(s2){s2.textContent="已保存";s2.className="saved"}},600)}
let toastTimer,undoFn;
function toast(msg,fn){$("#toastMsg").textContent=msg;undoFn=fn;$("#toast").classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("#toast").classList.remove("show"),5000)}
$("#undo").onclick=()=>{undoFn&&undoFn();$("#toast").classList.remove("show")};

function selectEvent(id){state.sel=id;state.open=true;$("#split").classList.add("open");renderList();renderDetail()}
function all(){renderChips();renderList();renderDetail()}

document.addEventListener("click",ev=>{
  const t=ev.target;
  const chip=t.closest(".chip[data-k]");if(chip){const s=state.f[chip.dataset.k],v=chip.dataset.v;s.has(v)?s.delete(v):s.add(v);renderChips();renderList();return}
  if(t.id==="clear"||t.id==="clear2"){Object.values(state.f).forEach(s=>s.clear());state.q="";$("#q").value="";renderChips();renderList();return}
  const col=t.closest("[data-col]");if(col){const v=col.dataset.col;state.collapsed.has(v)?state.collapsed.delete(v):state.collapsed.add(v);renderList();return}
  if(t.dataset.sus)return;
  if(t.dataset.pick!==undefined)return;
  const row=t.closest(".row");if(row){if(state.batch){const id=row.dataset.id;state.picked.has(id)?state.picked.delete(id):state.picked.add(id);renderList();return}selectEvent(row.dataset.id);return}
  if(t.id==="back"){$("#split").classList.remove("open");return}
  if(t.id==="batchBtn"){state.batch=!state.batch;state.picked.clear();t.classList.toggle("on",state.batch);t.textContent=state.batch?"退出批量":"批量选择";renderList();return}
  if(t.id==="newBtn"){const id="e"+Date.now();EV.unshift({id,name:"新事件",cat:"增益",desc:"",dur:30,cd:null,w:1,ver:VERSIONS[0],status:"development",tags:[]});selectEvent(id);return}
  if(t.id==="prev"||t.id==="next"){const l=visible(),i=l.findIndex(x=>x.id===state.sel),n=l[i+(t.id==="next"?1:-1)];if(n)selectEvent(n.id);return}
  if(t.id==="arch"){const e=EV.find(x=>x.id===state.sel),old=e.status;e.status="removed";markSaved();renderList();renderDetail();toast(`已归档「${e.name}」`,()=>{e.status=old;all()});return}
  if(t.dataset.b){const n=state.picked.size;if(!n)return;const prev=[...state.picked].map(id=>[id,EV.find(x=>x.id===id).status]);prev.forEach(([id])=>EV.find(x=>x.id===id).status=t.dataset.b);state.picked.clear();all();toast(`已更新 ${n} 条事件`,()=>{prev.forEach(([id,s])=>EV.find(x=>x.id===id).status=s);all()})}
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset.sus){const v=t.dataset.sus,was=suspended.has(v);was?suspended.delete(v):suspended.add(v);all();toast(`${v} ${was?"已恢复":"已挂起"}`,()=>{was?suspended.add(v):suspended.delete(v);all()});return}
  if(t.id==="bver"&&t.value){const n=state.picked.size,v=t.value,prev=[...state.picked].map(id=>[id,EV.find(x=>x.id===id).ver]);prev.forEach(([id])=>EV.find(x=>x.id===id).ver=v);state.picked.clear();all();toast(`已移动 ${n} 条到 ${v}`,()=>{prev.forEach(([id,o])=>EV.find(x=>x.id===id).ver=o);all()});return}
  if(t.dataset.f==="grp"){renderChips();renderDetail();markSaved();return}
  if(t.dataset.pick!==undefined){const id=t.dataset.pick;t.checked?state.picked.add(id):state.picked.delete(id);renderList()}
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="q"){state.q=t.value;renderList();return}
  const f=t.dataset.f;if(!f)return;const e=EV.find(x=>x.id===state.sel);
  let v=t.value;if(f==="dur"||f==="w")v=Number(v);if(f==="cd")v=v===""?null:Number(v);
  e[f]=v;markSaved();
  if(f==="grp"){renderList();return}
  renderList();
  if(f==="w"){const keep=t,fresh=document.createElement("div");const sv=state.sel;renderDetail();const nf=document.querySelector('[data-f="w"]');nf.focus();nf.setSelectionRange?.(nf.value.length,nf.value.length)}
  else if(["status","ver","cat"].includes(f)){renderDetail();document.querySelector(`[data-f="${f}"]`)?.focus()}
});
all();
</script>
</body>
</html>
