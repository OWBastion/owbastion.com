<!-- @dsCard group="管理端" height=660 -->
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;padding:var(--space-4);font-family:var(--font-ui);color:var(--text);background:var(--page);font-size:1rem;line-height:1.6}
.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
.col{display:grid;gap:var(--space-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:var(--control-md);padding:0 var(--space-4);border:1px solid transparent;border-radius:var(--radius-control);font:600 .875rem/1 var(--font-ui);cursor:pointer;color:var(--text);background:transparent}
.btn-sm{min-height:var(--control-sm);padding:0 var(--space-3);font-size:.8125rem}
.btn-lg{min-height:var(--control-lg);padding:0 var(--space-5);font-size:.9375rem}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-outline{border-color:var(--line-strong)}
.btn-soft{background:var(--surface-raised)}
.btn-ghost{color:var(--muted)}
.btn-danger{background:color-mix(in oklab,var(--danger) 12%,var(--surface));color:var(--danger)}
.btn-pressed{background:var(--accent-surface);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.field:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--elevation-2);padding:var(--space-4)}
.t-card-title{font-size:1.125rem;font-weight:600;line-height:1.35;letter-spacing:-.01em;margin:0;color:var(--text)}
.t-label{font-size:.9375rem;font-weight:600;line-height:1.4;color:var(--text)}
.t-label-sm{font-size:.8125rem;font-weight:500;line-height:1.4;color:var(--muted)}
.t-caption{font-size:.75rem;font-weight:500;line-height:1.4;color:var(--quiet)}
.t-body-sm{font-size:.875rem;line-height:1.55;color:var(--muted)}
.badge{display:inline-flex;align-items:center;min-height:24px;padding:var(--space-1) var(--space-2);border:1px solid var(--line);border-radius:var(--radius-pill);font-size:.75rem;font-weight:600;white-space:nowrap;color:var(--muted);background:var(--surface-raised)}
.badge-info{color:var(--info);border-color:color-mix(in oklab,var(--info) 48%,var(--line));background:var(--info-surface)}
.badge-success{color:var(--success);border-color:color-mix(in oklab,var(--success) 48%,var(--line));background:var(--success-surface)}
.badge-warning{color:var(--warning);border-color:color-mix(in oklab,var(--warning) 48%,var(--line));background:color-mix(in oklab,var(--warning) 12%,var(--surface))}
.badge-error{color:var(--danger);border-color:color-mix(in oklab,var(--danger) 48%,var(--line));background:color-mix(in oklab,var(--danger) 12%,var(--surface))}
.field{display:flex;align-items:center;width:100%;min-height:var(--control-md);padding:0 var(--space-3);gap:var(--space-2);border:1px solid var(--line-strong);border-radius:var(--radius-control);background:var(--surface);color:var(--text);font:400 .875rem/1.55 var(--font-ui)}
.field-focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.field-error{border-color:var(--danger)}
.field-disabled{background:var(--disabled-surface);color:var(--disabled-text);cursor:not-allowed}
.ph{color:var(--quiet)}
.mark{display:grid;place-items:center;flex:0 0 auto;width:2.5rem;height:2.5rem;border:1px solid var(--line-strong);border-radius:var(--radius-control);color:var(--muted);background:var(--surface-raised)}
.mark svg{width:52%;height:52%;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linejoin:round;stroke-linecap:round}
.tier-pioneer{border-color:color-mix(in oklab,var(--accent) 32%,var(--line-strong));color:var(--accent);background:color-mix(in oklab,var(--accent) 7%,var(--surface-raised))}
.tier-conqueror{border-color:color-mix(in oklab,var(--accent) 58%,var(--line-strong));color:var(--accent);background:color-mix(in oklab,var(--accent) 14%,var(--surface-raised))}
.tier-dominator{border-color:var(--accent);color:var(--accent);background:color-mix(in oklab,var(--accent) 24%,var(--surface-raised));box-shadow:0 0 1.25rem color-mix(in oklab,var(--accent) 34%,transparent)}
.stat-sheet{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-card);background:var(--line)}
.stat-sheet>div{display:grid;gap:var(--space-1);padding:var(--space-3) var(--space-4);background:var(--surface)}
.stat-sheet dd{grid-row:1;margin:0;font-size:1.75rem;font-weight:700;line-height:1.1;color:var(--text)}
.stat-sheet dd small{margin-left:var(--space-1);font-size:.75rem;font-weight:500;color:var(--quiet)}
.stat-sheet dt{grid-row:2;font-size:.8125rem;color:var(--muted)}
.summary{display:inline-flex;min-height:24px;align-items:center;gap:var(--space-1);padding:var(--space-1) var(--space-2);border:1px solid color-mix(in oklab,var(--accent) 30%,var(--line));border-radius:var(--radius-pill);color:var(--text);background:color-mix(in oklab,var(--accent-surface) 42%,var(--surface));font-size:.75rem;font-weight:600;line-height:1.2}
.summary .star{color:var(--accent)} .summary small{color:var(--quiet);font-size:.75rem;font-weight:500}
.summary.unavailable{border-color:var(--line-strong);color:var(--quiet);background:var(--surface)} .summary.unavailable .star{color:var(--quiet)}

.a-h{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap}
.a-t{margin:0;font-size:1.75rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.a-c{font-size:.75rem;font-weight:500;color:var(--quiet);margin-left:var(--space-2);letter-spacing:0}
.tool{display:flex;flex-wrap:wrap;gap:var(--space-2);padding:var(--space-2);border:1px solid var(--line);border-radius:var(--radius-control);background:color-mix(in oklab,var(--surface) 60%,var(--surface-raised))}
.tool .field{flex:1 1 9rem;width:auto}
.msg{padding:var(--space-2) var(--space-3);border-radius:var(--radius-control);background:var(--accent-surface);font-size:.875rem}
.al{padding:var(--space-3) var(--space-4);border-radius:var(--radius-card);border:1px solid}
.al b{display:block;font-size:.9375rem;font-weight:600}.al span{font-size:.875rem;color:var(--text)}
.al-info{border-color:color-mix(in oklab,var(--info) 40%,transparent);background:var(--info-surface)}.al-info b{color:var(--info)}
.al-success{border-color:color-mix(in oklab,var(--success) 40%,transparent);background:var(--success-surface)}.al-success b{color:var(--success)}
.al-warning{border-color:color-mix(in oklab,var(--warning) 40%,transparent);background:color-mix(in oklab,var(--warning) 12%,var(--surface))}.al-warning b{color:var(--warning)}
.al-danger{border-color:color-mix(in oklab,var(--danger) 40%,transparent);background:color-mix(in oklab,var(--danger) 12%,var(--surface))}.al-danger b{color:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:var(--space-1);min-height:var(--control-sm);padding:0 var(--space-3);border:1px solid var(--line-strong);border-radius:var(--radius-pill);background:var(--surface);color:var(--muted);font:500 .8125rem/1 var(--font-ui);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mono{font-family:var(--font-ui);font-variant-numeric:tabular-nums}
.code{display:inline-block;padding:var(--space-1) var(--space-2);border:1px solid var(--line);border-radius:var(--radius-control);background:var(--surface-raised);font:500 .8125rem/1.5 var(--font-ui);overflow-wrap:anywhere}
.dg{margin:0;display:grid}
.dg>div{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:var(--space-4);padding:var(--space-2) 0;border-bottom:1px solid var(--line)}
.dg>div:last-child{border-bottom:0}
.dg dt{font-size:.8125rem;font-weight:500;color:var(--muted)}
.dg dd{margin:0;font-size:.9375rem;font-weight:600;overflow-wrap:anywhere}
.dg .na{color:var(--quiet);font-weight:500}
.dlg{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-sheet);box-shadow:var(--elevation-3);display:grid;overflow:hidden}
.dlg>header{padding:var(--space-4) var(--space-5) var(--space-2)}
.dlg>header h3{margin:0;font-size:1.125rem;font-weight:600}
.dlg>header p{margin:0;font-size:.8125rem;color:var(--quiet)}
.dlg>.body{padding:var(--space-2) var(--space-5) var(--space-4);display:grid;gap:var(--space-3)}
.dlg>footer{display:flex;gap:var(--space-2);padding:var(--space-3) var(--space-5);border-top:1px solid var(--line);background:var(--surface-raised)}
.sec{margin:0;font-size:.75rem;font-weight:600;letter-spacing:.055em;color:var(--quiet)}
.lab{display:grid;gap:var(--space-1);font-size:.8125rem;font-weight:500;color:var(--muted)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs span{padding:var(--space-2) var(--space-4);font-size:.9375rem;font-weight:600;color:var(--muted)}
.tabs .on{color:var(--accent);border-bottom:2px solid var(--accent);margin-bottom:-1px}
.pn{border:1px solid var(--line);border-radius:var(--radius-card);background:var(--surface);padding:var(--space-4);display:grid;gap:var(--space-3);box-shadow:var(--elevation-1)}
.pn h3{margin:0;font-size:1rem;font-weight:700;letter-spacing:-.02em}
.kick{margin:0;font-size:.75rem;font-weight:600;letter-spacing:.06em;color:var(--quiet)}
.ph2{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3)}
.small{font-size:.8125rem;color:var(--quiet)}
.li{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);padding:var(--space-2) 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li strong{font-size:.9375rem;font-weight:600}
.cap{max-width:30rem}
.tx{min-height:5rem;align-items:flex-start;padding-top:var(--space-2)}
.bd{background:var(--surface-raised);border-radius:var(--radius-sheet);padding:var(--space-4);display:grid;gap:var(--space-4)}
.ok{color:var(--success)}.wn{color:var(--warning)}.er{color:var(--danger)}.ac{color:var(--accent)}
</style></head><body><section class="col" aria-label="审核详情" style="gap:var(--space-3)">
<div class="a-h" style="align-items:center"><span class="t-body-sm"><strong style="color:var(--text)">夜枭<span style="color:var(--quiet)">#1234</span></strong> · 提交于 <time class="num">2026年10月5日 19:22</time></span><span class="badge badge-warning">待审核</span></div>
<div class="row" style="align-items:flex-start;gap:var(--space-4)">
<div style="flex:3 1 16rem;display:grid;gap:var(--space-3)">
<div class="card" style="display:grid;gap:var(--space-2)"><h3 class="t-card-title">截图</h3><div style="aspect-ratio:16/9;border-radius:var(--radius-control);background:var(--surface-raised);display:grid;place-items:center" class="t-caption">玩家提交的截图</div></div>
<div class="pn"><div class="ph2"><h3>识别结果</h3><span class="t-label-sm num">5 项一致 · 2 项需确认</span></div>
<div class="li"><span><strong>通关用时</strong><br><small class="small">截图识别为 18:42</small></span><span class="badge badge-warning">需确认</span></div>
<div class="li"><span><strong>死亡次数</strong><br><small class="small">截图识别为 3</small></span><span class="badge badge-warning">需确认</span></div></div></div>
<section class="card" style="flex:2 1 16rem;display:grid;gap:var(--space-3);box-shadow:var(--elevation-2)" aria-label="审核决定">
<div style="display:grid;gap:var(--space-2)"><h3 class="t-card-title" style="font-size:1rem">通过后玩家将获得</h3>
<ul class="t-body-sm" style="margin:0;padding-left:var(--space-5)"><li>先驱者 <small class="small">全局称号</small></li><li>地中海通关 <small class="small">地中海 · 地图称号</small></li></ul>
<p class="t-caption" style="margin:0">同时记录一次已验证通关。</p></div>
<div class="col" role="group" aria-label="审核操作" style="gap:var(--space-2)"><button class="btn btn-primary btn-lg" >通过</button><button class="btn btn-outline" >要求重新提交</button><button class="btn btn-danger" >驳回</button></div>
<button class="btn btn-ghost btn-sm" style="justify-self:start">更多 ⌄</button></section></div></section></body></html>
