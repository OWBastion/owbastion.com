<!-- @dsCard group="提交与评价" height=430 -->
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;padding:var(--space-4);font-family:var(--font-ui);color:var(--text);background:var(--page);font-size:1rem;line-height:1.6}
.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
.col{display:grid;gap:var(--space-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:var(--control-md);padding:0 var(--space-4);border:1px solid transparent;border-radius:var(--radius-control);font:600 .875rem/1 var(--font-ui);color:var(--text);background:transparent}
.btn-sm{min-height:var(--control-sm);padding:0 var(--space-3);font-size:.8125rem}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-outline{border-color:var(--line-strong)}
.btn:disabled{opacity:.5}
.btn svg,.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--elevation-2);padding:var(--space-4)}
.t-card-title{font-size:1.125rem;font-weight:600;line-height:1.35;margin:0}
.t-label{font-size:.9375rem;font-weight:600;line-height:1.4}
.t-label-sm{font-size:.8125rem;font-weight:500;color:var(--muted)}
.t-caption{font-size:.75rem;font-weight:500;color:var(--quiet)}
.t-body-sm{font-size:.875rem;line-height:1.55;color:var(--muted)}
.cap{font-size:.75rem;color:var(--quiet);margin:0 0 var(--space-2)}
.pill{display:inline-flex;align-items:center;min-height:24px;padding:0 var(--space-2);border:1px solid var(--line);border-radius:var(--radius-pill);font-size:.75rem;font-weight:600;color:var(--muted);background:var(--surface-raised);white-space:nowrap}
.pill-acc{color:var(--accent);border-color:color-mix(in oklab,var(--accent) 45%,var(--line));background:var(--accent-surface)}
.alert{padding:var(--space-3) var(--space-4);border:1px solid var(--line);border-radius:var(--radius-control);font-size:.875rem}
.alert b{display:block;font-weight:600}
.alert-ok{color:var(--success);border-color:color-mix(in oklab,var(--success) 48%,var(--line));background:var(--success-surface)}
.alert-err{color:var(--danger);border-color:color-mix(in oklab,var(--danger) 48%,var(--line));background:color-mix(in oklab,var(--danger) 12%,var(--surface))}
.alert-warn{color:var(--warning);border-color:color-mix(in oklab,var(--warning) 48%,var(--line));background:color-mix(in oklab,var(--warning) 12%,var(--surface))}
.alert-neu{color:var(--muted);background:var(--surface-raised)}
form{border-top:1px solid var(--line);padding-top:var(--space-4);display:grid;gap:var(--space-3);max-width:440px}
.hd{display:flex;justify-content:space-between;align-items:baseline}.hd h4{margin:0;font-size:.95rem;font-weight:600}.hd span{font-size:.76rem;color:var(--muted)}
fieldset{border:0;margin:0;padding:0}legend{font-size:.8125rem;font-weight:600;padding:0;margin-bottom:var(--space-2)}
.st{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-2)}
.sb{display:grid;justify-items:center;padding:var(--space-2) 0;border:1px solid var(--line-strong);border-radius:var(--radius-control);background:transparent;color:var(--text);font:600 .75rem/1.3 var(--font-ui)}
.sb.on{background:var(--accent-surface);color:var(--accent);border-color:var(--accent)}
label.l{font-size:.8125rem;font-weight:600}
.ta{min-height:96px;margin-top:var(--space-1);padding:var(--space-2) var(--space-3);border:1px solid var(--line-strong);border-radius:var(--radius-control);background:var(--surface);font-size:.82rem}
.ck{display:flex;align-items:center;gap:var(--space-2);min-height:44px;font-size:.875rem}.ck i{width:18px;height:18px;border:1px solid var(--line-strong);border-radius:var(--radius-control);background:var(--surface)}
.nt{margin:0;font-size:.75rem;color:var(--quiet)}
</style><style>.stars{display:flex;align-items:center;gap:var(--space-1)}.star{display:grid;place-items:center;width:var(--control-md);height:var(--control-md);padding:0;border:0;border-radius:var(--radius-control);background:transparent;color:var(--line-strong);font-size:1.75rem;line-height:1;cursor:pointer}.star.on{color:var(--accent)}.star:focus-visible{outline:2px solid var(--accent);outline-offset:2px}</style></head><body>
<form onsubmit="return false"><div class="hd"><h4>编辑评价</h4><span class="num">17/500</span></div>
<fieldset><legend>评分</legend><div class="stars" role="group"><button type="button" class="star on" aria-pressed="false" aria-label="1 星">★</button><button type="button" class="star on" aria-pressed="false" aria-label="2 星">★</button><button type="button" class="star on" aria-pressed="false" aria-label="3 星">★</button><button type="button" class="star on" aria-pressed="true" aria-label="4 星">★</button><button type="button" class="star" aria-pressed="false" aria-label="5 星">★</button><span class="t-sm" style="margin-left:var(--space-2);color:var(--muted)">4 / 5</span></div></fieldset>
<div><label class="l">评价内容</label><div class="ta">机制设计得很巧妙，但中段节奏偏慢。</div></div>
<div><label class="ck"><i></i>匿名展示</label><p class="nt" id="review-anonymous-note">匿名展示只对其他玩家隐藏身份，维护人员仍可追溯。</p></div>
<div class="row"><button class="btn btn-primary">保存修改</button><button class="btn btn-outline">撤回评价</button></div></form>
</body></html>
