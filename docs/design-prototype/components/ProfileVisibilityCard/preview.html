<!-- @dsCard group="玩家端" height=470 -->
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;padding:var(--space-4);font-family:var(--font-ui);color:var(--text);background:var(--page);font-size:1rem;line-height:1.6}
h2,h3,h4,p,ul,ol,dl,dd{margin:0}ul,ol{padding:0;list-style:none}
.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
.col{display:grid;gap:var(--space-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--elevation-2);padding:var(--space-4)}
.num{font-variant-numeric:tabular-nums}
.t-title{font-size:1.125rem;font-weight:600;line-height:1.35;letter-spacing:-.01em;color:var(--text)}
.t-head{font-size:1.375rem;font-weight:600;line-height:1.2;letter-spacing:-.02em;color:var(--text)}
.t-label{font-size:.9375rem;font-weight:600;line-height:1.4;color:var(--text)}
.t-sm{font-size:.8125rem;font-weight:500;line-height:1.4;color:var(--muted)}
.t-cap{font-size:.75rem;font-weight:500;line-height:1.4;color:var(--quiet)}
.t-body{font-size:.875rem;line-height:1.55;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:var(--control-md);padding:0 var(--space-4);border:1px solid transparent;border-radius:var(--radius-control);font:600 .875rem/1 var(--font-ui);color:var(--text);background:transparent}
.btn-sm{min-height:var(--control-sm);padding:0 var(--space-3);font-size:.8125rem}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-outline{border-color:var(--line-strong)}
.btn-ghost{color:var(--muted)}
.btn-danger{background:color-mix(in oklab,var(--danger) 12%,var(--surface));color:var(--danger)}
.btn:disabled{opacity:.5}
.badge{display:inline-flex;align-items:center;min-height:24px;padding:var(--space-1) var(--space-2);border:1px solid var(--line);border-radius:var(--radius-pill);font-size:.75rem;font-weight:600;white-space:nowrap;color:var(--muted);background:var(--surface-raised)}
.b-info{color:var(--info);border-color:color-mix(in oklab,var(--info) 48%,var(--line));background:var(--info-surface)}
.b-success{color:var(--success);border-color:color-mix(in oklab,var(--success) 48%,var(--line));background:var(--success-surface)}
.b-warning{color:var(--warning);border-color:color-mix(in oklab,var(--warning) 48%,var(--line));background:color-mix(in oklab,var(--warning) 12%,var(--surface))}
.b-error{color:var(--danger);border-color:color-mix(in oklab,var(--danger) 48%,var(--line));background:color-mix(in oklab,var(--danger) 12%,var(--surface))}
.b-accent{color:var(--accent);border-color:color-mix(in oklab,var(--accent) 50%,var(--line));background:var(--accent-surface)}
.field{display:flex;align-items:center;width:100%;min-height:var(--control-md);padding:0 var(--space-3);gap:var(--space-2);border:1px solid var(--line-strong);border-radius:var(--radius-control);background:var(--surface);color:var(--text);font:400 .875rem/1.55 var(--font-ui)}
.ph{color:var(--quiet)}
.avatar{display:grid;place-items:center;flex:0 0 auto;border-radius:50%;border:1px solid var(--line-strong);color:var(--accent);background:var(--accent-surface);font-weight:700;letter-spacing:-.04em}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--elevation-2);padding:var(--space-1);min-width:14rem}
.mi{display:flex;align-items:center;gap:var(--space-2);min-height:2.75rem;padding:0 var(--space-3);border-radius:var(--radius-control);font-size:.875rem;font-weight:500;color:var(--text)}
.mi svg,.ic{width:1rem;height:1rem;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.mi.sel{background:var(--surface-raised)}
.mi.dg{color:var(--danger)}
.sep{height:1px;margin:var(--space-1) 0;background:var(--line)}
.sk{border-radius:var(--radius-control);background:var(--surface-raised)}
.facts{display:grid;gap:0}
.facts>div{display:flex;justify-content:space-between;gap:var(--space-3);padding:var(--space-2) 0;border-bottom:1px solid var(--line)}
.facts dt{font-size:.8125rem;color:var(--muted)}
.facts dd{font-size:.875rem;font-weight:600;color:var(--text);text-align:right}
.alert{padding:var(--space-3) var(--space-4);border-radius:var(--radius-card);border:1px solid color-mix(in oklab,var(--danger) 40%,transparent);background:color-mix(in oklab,var(--danger) 10%,var(--surface))}
.alert.w{border-color:color-mix(in oklab,var(--warning) 40%,transparent);background:color-mix(in oklab,var(--warning) 10%,var(--surface))}
.alert strong{display:block;font-size:.875rem;color:var(--text)}.alert span{font-size:.8125rem;color:var(--muted)}
.mark{display:grid;place-items:center;flex:0 0 auto;width:2.5rem;height:2.5rem;border:1px solid var(--line-strong);border-radius:var(--radius-control);color:var(--muted);background:var(--surface-raised)}
.mark svg{width:52%;height:52%;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linejoin:round;stroke-linecap:round}
.tier-dominator{border-color:var(--accent);color:var(--accent);background:color-mix(in oklab,var(--accent) 24%,var(--surface-raised));box-shadow:0 0 1.25rem color-mix(in oklab,var(--accent) 34%,transparent)}
.tier-conqueror{border-color:color-mix(in oklab,var(--accent) 58%,var(--line-strong));color:var(--accent);background:color-mix(in oklab,var(--accent) 14%,var(--surface-raised))}
.tier-pioneer{border-color:color-mix(in oklab,var(--accent) 32%,var(--line-strong));color:var(--accent);background:color-mix(in oklab,var(--accent) 7%,var(--surface-raised))}
.pill{display:inline-flex;align-items:center;padding:var(--space-1) var(--space-2);border-radius:var(--radius-pill);border:1px solid color-mix(in oklab,var(--accent) 30%,var(--line));background:color-mix(in oklab,var(--accent) 7%,var(--surface));font-size:.75rem;font-weight:600;color:var(--text)}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sheet);box-shadow:var(--elevation-3)}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4)}.vrow strong{font-size:.85rem;color:var(--text)}.vrow p{font-size:.75rem;color:var(--quiet);line-height:1.5}.vcopy{display:grid;gap:var(--space-1)}.sw{position:relative;flex:0 0 auto;width:2.5rem;height:1.5rem;border-radius:var(--radius-pill);background:var(--line-strong)}.sw::after{content:"";position:absolute;top:2px;left:2px;width:calc(1.5rem - 4px);height:calc(1.5rem - 4px);border-radius:50%;background:var(--surface)}.sw.on{background:var(--accent)}.sw.on::after{left:calc(1rem + 2px);background:var(--on-accent)}.sw.dis{opacity:.5}.verr{color:var(--danger)!important}</style></head><body><div class="col" style="max-width:30rem"><section class="card" style="background:var(--surface-raised);box-shadow:none"><div class="vrow"><div class="vcopy"><strong>公开主页</strong><p>在排行榜公开显示你的昵称与称号。关闭后名次与分数照常保留，但昵称、头像、称号和地图明细不再公开，你会显示为匿名玩家。</p><span class="t-cap">开</span></div><span class="sw on" role="switch" aria-label="公开主页"></span></div></section><section class="card" style="background:var(--surface-raised);box-shadow:none"><div class="vrow"><div class="vcopy"><strong>公开主页</strong><p>在排行榜公开显示你的昵称与称号。关闭后名次与分数照常保留，但昵称、头像、称号和地图明细不再公开，你会显示为匿名玩家。</p><span class="t-cap">保存中（开关禁用）</span></div><span class="sw on dis" role="switch" aria-label="公开主页"></span></div></section><section class="card" style="background:var(--surface-raised);box-shadow:none"><div class="vrow"><div class="vcopy"><strong>公开主页</strong><p>在排行榜公开显示你的昵称与称号。关闭后名次与分数照常保留，但昵称、头像、称号和地图明细不再公开，你会显示为匿名玩家。</p><p class="verr" role="alert">保存失败，请稍后重试。</p><span class="t-cap">失败回滚（已恢复为关）</span></div><span class="sw" role="switch" aria-label="公开主页"></span></div></section></div></body></html>
