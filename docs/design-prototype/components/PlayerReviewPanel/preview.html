<!-- @dsCard group="提交与评价" height=340 -->
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;padding:var(--space-4);font-family:var(--font-ui);color:var(--text);background:var(--page);font-size:1rem;line-height:1.6}
.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
.col{display:grid;gap:var(--space-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:var(--control-md);padding:0 var(--space-4);border:1px solid transparent;border-radius:var(--radius-control);font:600 .875rem/1 var(--font-ui);color:var(--text);background:transparent}
.btn-sm{min-height:var(--control-sm);padding:0 var(--space-3);font-size:.8125rem}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-outline{border-color:var(--line-strong)}
.btn:disabled{opacity:.5}
.btn svg,.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--elevation-2);padding:var(--space-4)}
.t-card-title{font-size:1.125rem;font-weight:600;line-height:1.35;margin:0}
.t-label{font-size:.9375rem;font-weight:600;line-height:1.4}
.t-label-sm{font-size:.8125rem;font-weight:500;color:var(--muted)}
.t-caption{font-size:.75rem;font-weight:500;color:var(--quiet)}
.t-body-sm{font-size:.875rem;line-height:1.55;color:var(--muted)}
.cap{font-size:.75rem;color:var(--quiet);margin:0 0 var(--space-2)}
.pill{display:inline-flex;align-items:center;min-height:24px;padding:0 var(--space-2);border:1px solid var(--line);border-radius:var(--radius-pill);font-size:.75rem;font-weight:600;color:var(--muted);background:var(--surface-raised);white-space:nowrap}
.pill-acc{color:var(--accent);border-color:color-mix(in oklab,var(--accent) 45%,var(--line));background:var(--accent-surface)}
.alert{padding:var(--space-3) var(--space-4);border:1px solid var(--line);border-radius:var(--radius-control);font-size:.875rem}
.alert b{display:block;font-weight:600}
.alert-ok{color:var(--success);border-color:color-mix(in oklab,var(--success) 48%,var(--line));background:var(--success-surface)}
.alert-err{color:var(--danger);border-color:color-mix(in oklab,var(--danger) 48%,var(--line));background:color-mix(in oklab,var(--danger) 12%,var(--surface))}
.alert-warn{color:var(--warning);border-color:color-mix(in oklab,var(--warning) 48%,var(--line));background:color-mix(in oklab,var(--warning) 12%,var(--surface))}
.alert-neu{color:var(--muted);background:var(--surface-raised)}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-4)}.sh h3{margin:0;font-size:1.0625rem;font-weight:600}
.ov{display:grid;grid-template-columns:minmax(94px,.7fr) 1.3fr;gap:var(--space-4);align-items:center}
.avg strong{display:block;font-size:2.4rem;font-weight:700;line-height:1.1;letter-spacing:0}.avg .dp{font-size:inherit;color:inherit;display:inline-block;width:.15em;height:.15em;margin-inline:.1em;border-radius:var(--radius-pill);background:currentColor}.avg span{font-size:.75rem;color:var(--muted)}
.dr{display:grid;grid-template-columns:34px 1fr 24px;gap:var(--space-2);align-items:center;font-size:.75rem;color:var(--muted);margin-bottom:var(--space-1)}
.tr{height:7px;border-radius:var(--radius-pill);background:var(--surface-raised);overflow:hidden}.tr i{display:block;height:100%;background:var(--accent)}
.g{border-top:1px solid var(--line);margin-top:var(--space-4);padding-top:var(--space-4)}
</style></head><body>
<section class="card" style="max-width:460px" aria-labelledby="review-title-ruins"><div class="sh"><h3 id="review-title-ruins">玩家评分</h3></div>
<div class="ov"><div class="avg"><strong class="num">4<span class="dp" role="presentation"></span><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">.</span>3</strong><span>126 条有效评价</span></div><div><div class="dr"><span>5 星</span><div class="tr"><i style="width:100%"></i></div><span class="num">70</span></div><div class="dr"><span>4 星</span><div class="tr"><i style="width:45.714285714285715%"></i></div><span class="num">32</span></div><div class="dr"><span>3 星</span><div class="tr"><i style="width:20%"></i></div><span class="num">14</span></div><div class="dr"><span>2 星</span><div class="tr"><i style="width:8.571428571428571%"></i></div><span class="num">6</span></div><div class="dr"><span>1 星</span><div class="tr"><i style="width:5.714285714285714%"></i></div><span class="num">4</span></div></div></div>
<div class="g"><button class="btn btn-primary">登录后评分</button></div></section>
</body></html>
