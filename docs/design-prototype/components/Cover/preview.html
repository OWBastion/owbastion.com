<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
html,body{margin:0}
body{position:relative;width:960px;height:288px;overflow:hidden;background:var(--page);font-family:var(--font-ui);color:var(--text)}
svg{position:absolute;inset:0}
.accent{fill:var(--accent)} .ink{fill:var(--text)} .tint{fill:var(--accent-surface)} .raised{fill:var(--surface-raised)} .info{fill:var(--info)}
.l1{fill:var(--accent);fill-opacity:.07;stroke:var(--accent);stroke-opacity:.32} .l2{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-opacity:.58} .l3{fill:var(--accent);fill-opacity:.24;stroke:var(--accent)} .l4{fill:var(--accent);stroke:var(--accent)}
.l1,.l2,.l3,.l4{stroke-width:1}
.text{position:absolute;left:var(--space-8);bottom:var(--space-8);width:440px}
h1{margin:0;font-size:80px;line-height:.95;font-weight:700;letter-spacing:-.04em}
p{margin:var(--space-3) 0 0;font-size:14px;color:var(--muted)}
</style></head><body>
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!-- blocks: accent 112x176, text 112x112, accent-surface 176x112, raised 112x48 (tile 48 = space-12, gap 16 = space-4)
     arrangement: staggered slabs bleeding off the top edge, ladder row beneath
     pattern: intensity ladder (accent mixed 7/14/24/100%) because the Portal states slot strength as border intensity, never rank
     steps/radii: 16/32/48 steps, radius-card 16 for slabs, radius-control 10 for tiles -->
<rect class="accent" x="496" y="-16" width="112" height="192" rx="16"/>
<rect class="ink" x="624" y="-16" width="112" height="144" rx="16"/>
<rect class="tint" x="752" y="-16" width="176" height="144" rx="16"/>
<rect class="raised" x="624" y="144" width="112" height="32" rx="10"/>
<rect class="info" x="752" y="144" width="48" height="32" rx="10"/>
<rect class="l1" x="496" y="208" width="48" height="48" rx="10"/>
<rect class="l2" x="560" y="208" width="48" height="48" rx="10"/>
<rect class="l3" x="624" y="208" width="48" height="48" rx="10"/>
<rect class="l4" x="688" y="208" width="48" height="48" rx="10"/>
</svg>
<div class="text"><h1>OWBastion Portal</h1><p>先回答玩家为什么来，再展示其余。</p></div>
</body></html>
