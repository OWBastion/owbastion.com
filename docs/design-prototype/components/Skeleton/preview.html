<!-- @dsCard group="反馈" height=260 -->
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;padding:var(--space-4);font-family:var(--font-ui);color:var(--text);background:var(--page);font-size:1rem;line-height:1.6}
.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
.col{display:grid;gap:var(--space-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:var(--control-md);padding:0 var(--space-4);border:1px solid transparent;border-radius:var(--radius-control);font:600 .875rem/1 var(--font-ui);cursor:pointer;color:var(--text);background:transparent}
.btn-sm{min-height:var(--control-sm);padding:0 var(--space-3);font-size:.8125rem}
.btn-lg{min-height:var(--control-lg);padding:0 var(--space-5);font-size:.9375rem}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-outline{border-color:var(--line-strong)}
.btn-soft{background:var(--surface-raised)}
.btn-ghost{color:var(--muted)}
.btn-danger{background:color-mix(in oklab,var(--danger) 12%,var(--surface));color:var(--danger)}
.btn-pressed{background:var(--accent-surface);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.field:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--elevation-2);padding:var(--space-4)}
.t-card-title{font-size:1.125rem;font-weight:600;line-height:1.35;letter-spacing:-.01em;margin:0;color:var(--text)}
.t-label{font-size:.9375rem;font-weight:600;line-height:1.4;color:var(--text)}
.t-label-sm{font-size:.8125rem;font-weight:500;line-height:1.4;color:var(--muted)}
.t-caption{font-size:.75rem;font-weight:500;line-height:1.4;color:var(--quiet)}
.t-body-sm{font-size:.875rem;line-height:1.55;color:var(--muted)}
.badge{display:inline-flex;align-items:center;min-height:24px;padding:var(--space-1) var(--space-2);border:1px solid var(--line);border-radius:var(--radius-pill);font-size:.75rem;font-weight:600;white-space:nowrap;color:var(--muted);background:var(--surface-raised)}
.badge-info{color:var(--info);border-color:color-mix(in oklab,var(--info) 48%,var(--line));background:var(--info-surface)}
.badge-success{color:var(--success);border-color:color-mix(in oklab,var(--success) 48%,var(--line));background:var(--success-surface)}
.badge-warning{color:var(--warning);border-color:color-mix(in oklab,var(--warning) 48%,var(--line));background:color-mix(in oklab,var(--warning) 12%,var(--surface))}
.badge-error{color:var(--danger);border-color:color-mix(in oklab,var(--danger) 48%,var(--line));background:color-mix(in oklab,var(--danger) 12%,var(--surface))}
.field{display:flex;align-items:center;width:100%;min-height:var(--control-md);padding:0 var(--space-3);gap:var(--space-2);border:1px solid var(--line-strong);border-radius:var(--radius-control);background:var(--surface);color:var(--text);font:400 .875rem/1.55 var(--font-ui)}
.field-focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.field-error{border-color:var(--danger)}
.field-disabled{background:var(--disabled-surface);color:var(--disabled-text);cursor:not-allowed}
.ph{color:var(--quiet)}
.mark{display:grid;place-items:center;flex:0 0 auto;width:2.5rem;height:2.5rem;border:1px solid var(--line-strong);border-radius:var(--radius-control);color:var(--muted);background:var(--surface-raised)}
.mark svg{width:52%;height:52%;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linejoin:round;stroke-linecap:round}
.tier-pioneer{border-color:color-mix(in oklab,var(--accent) 32%,var(--line-strong));color:var(--accent);background:color-mix(in oklab,var(--accent) 7%,var(--surface-raised))}
.tier-conqueror{border-color:color-mix(in oklab,var(--accent) 58%,var(--line-strong));color:var(--accent);background:color-mix(in oklab,var(--accent) 14%,var(--surface-raised))}
.tier-dominator{border-color:var(--accent);color:var(--accent);background:color-mix(in oklab,var(--accent) 24%,var(--surface-raised));box-shadow:0 0 1.25rem color-mix(in oklab,var(--accent) 34%,transparent)}
.stat-sheet{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-card);background:var(--line)}
.stat-sheet>div{display:grid;gap:var(--space-1);padding:var(--space-3) var(--space-4);background:var(--surface)}
.stat-sheet dd{grid-row:1;margin:0;font-size:1.75rem;font-weight:700;line-height:1.1;color:var(--text)}
.stat-sheet dd small{margin-left:var(--space-1);font-size:.75rem;font-weight:500;color:var(--quiet)}
.stat-sheet dt{grid-row:2;font-size:.8125rem;color:var(--muted)}
.summary{display:inline-flex;min-height:24px;align-items:center;gap:var(--space-1);padding:var(--space-1) var(--space-2);border:1px solid color-mix(in oklab,var(--accent) 30%,var(--line));border-radius:var(--radius-pill);color:var(--text);background:color-mix(in oklab,var(--accent-surface) 42%,var(--surface));font-size:.75rem;font-weight:600;line-height:1.2}
.summary .star{color:var(--accent)} .summary small{color:var(--quiet);font-size:.75rem;font-weight:500}
.summary.unavailable{border-color:var(--line-strong);color:var(--quiet);background:var(--surface)} .summary.unavailable .star{color:var(--quiet)}
</style></head><body><div class="card" style="max-width:360px;display:grid;gap:var(--space-3)" role="status" aria-label="读取中…"><div style="height:16px;width:60%;border-radius:var(--radius-control);background:var(--surface-raised)"></div><div style="height:96px;border-radius:var(--radius-control);background:var(--surface-raised)"></div><div style="height:16px;width:40%;border-radius:var(--radius-control);background:var(--surface-raised)"></div></div></body></html>
