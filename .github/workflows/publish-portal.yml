name: Publish Portal image

on:
  pull_request:
    paths:
      - 'apps/portal/**'
      - 'packages/**'
      - 'migrations/**'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - '.github/workflows/publish-portal.yml'
  push:
    branches: [main]
    paths:
      - 'apps/portal/**'
      - 'packages/**'
      - 'migrations/**'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - '.github/workflows/publish-portal.yml'

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PNPM_VERSION: 11.11.0
  NODE_VERSION: 26

jobs:
  validate:
    name: Validate (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: migration checks
            command: pnpm run check:migrations
          - name: unit tests
            command: pnpm run test:unit
          - name: Portal UI tests
            command: pnpm run test:portal-ui --run
          - name: typecheck
            command: pnpm run typecheck
          - name: API build
            command: pnpm run build:api
          - name: Portal build and SSR smoke
            command: >-
              pnpm run build:portal && NUXT_TEST_PORT=3000
              pnpm run test:portal-e2e:built
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  verify:
    name: Verify platform
    if: always()
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation checks to pass
        run: test "${{ needs.validate.result }}" = success

  publish:
    name: Publish Portal image
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/owbastion/owbastion.codes-portal
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Portal image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/portal/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
