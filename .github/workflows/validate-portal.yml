name: Validate Portal

on:
  pull_request:
    paths:
      - 'apps/portal/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - '.github/workflows/validate-portal.yml'
  push:
    branches: [main]
    paths:
      - 'apps/portal/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - '.github/workflows/validate-portal.yml'

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PNPM_VERSION: 11.11.0
  NODE_VERSION: 26

jobs:
  validate:
    name: Validate (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Portal UI tests
            command: pnpm run test:portal-ui --run
          - name: Portal public catalog cache
            command: >-
              pnpm --filter @owbastion/portal exec nuxi prepare &&
              pnpm exec vitest run apps/portal/server/utils/public-catalog.test.ts
          - name: Portal typecheck
            command: >-
              pnpm --filter @owbastion/portal exec nuxi prepare &&
              pnpm run typecheck:portal
          - name: Portal build and SSR smoke
            command: >-
              pnpm run build:portal && NUXT_TEST_PORT=3000
              pnpm run test:portal-e2e:built
          - name: Portal Worker build
            command: pnpm --filter @owbastion/portal run build:worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  verify:
    name: Verify platform
    if: always()
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation checks to pass
        run: test "${{ needs.validate.result }}" = success
