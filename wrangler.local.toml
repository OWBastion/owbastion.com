name = "owbastion-codes-api-local"
main = "apps/api/src/worker.ts"
compatibility_date = "2026-07-14"
workers_dev = true

[triggers]
crons = ["*/5 * * * *"]

[vars]
PORTAL_ORIGIN = "http://localhost:3000"
LOCAL_DEV_AUTH = "true"
UPLOAD_ORIGIN = "http://localhost:8787"
OCR_AUTO_REVIEW_SAMPLE_RATE = "0"
MASTERY_MIN_GAME_VERSION = ""
MASTERY_SUPPORTED_OCR_LAYOUT_VERSIONS = ""
OCRKIT_BASE_URL = "https://ocr.owbastion.com"
EVIDENCE_PUBLIC_ORIGIN = ""
ASSETS_PUBLIC_ORIGIN = "https://cdn.owbastion.codes"
# Cloudflare 公开的恒通过 Turnstile 测试 secret（见 Cloudflare 文档）；生产 secret 走 wrangler secret put。
TURNSTILE_SECRET_KEY = "1x0000000000000000000000000000000AA"

[[d1_databases]]
binding = "DB"
database_name = "owbastion-codes-prod"
database_id = "40fb80aa-f17e-467d-9d4d-b8b3100b141d"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "PLATFORM_CACHE"
id = "owbastion-codes-cache-local"

[[r2_buckets]]
binding = "EVIDENCE_BUCKET"
bucket_name = "owbastion-codes-evidence"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "cdn-owbastion-codes"

[[queues.producers]]
binding = "OCR_QUEUE"
queue = "owbastion-ocr-local"

[[queues.producers]]
binding = "QQ_POLICY_QUEUE"
queue = "owbastion-qq-policy-local"

[[queues.consumers]]
queue = "owbastion-ocr-local"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "owbastion-ocr-local-dlq"

[[queues.consumers]]
queue = "owbastion-ocr-local-dlq"
max_batch_size = 1
max_retries = 5

[[queues.consumers]]
queue = "owbastion-qq-policy-local"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "owbastion-qq-policy-local-dlq"
